<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:308px;height:609px;background:#FBFDFB;" width="308px" height="609px" viewBox="0 0 308 609" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="308" height="609" fill="#FBFDFB" style="stroke:none;"/><g class="title" data-source-line="8"><text x="27.002" y="32.995" fill="#000" font-size="14" textLength="251.999" font-weight="700" font-family="Montserrat">一条因果链：每一步都是上一步逼出来的</text></g><ellipse cx="152.001" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="100.001" y="92.297" width="104.001" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.001" y="113.436" fill="#000" font-size="12" textLength="48" font-weight="700" font-family="Montserrat">进程会死</text><text x="110.001" y="127.404" fill="#000" font-size="12" textLength="84.001" font-family="Montserrat">唯一的物理事实</text><rect x="82.001" y="160.234" width="140.001" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="102.832" y="181.373" fill="#000" font-size="12" textLength="98.339" font-weight="700" font-family="Montserrat">① 等待独立于进程</text><text x="92.001" y="195.342" fill="#000" font-size="12" textLength="120.001" font-family="Montserrat">等待不能住在调用栈里</text><rect x="22" y="228.172" width="260.002" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.831" y="249.311" fill="#000" font-size="12" textLength="170.339" font-weight="700" font-family="Montserrat">② 唤醒必须匹配到一个具体等待</text><text x="32" y="263.279" fill="#000" font-size="12" textLength="240.002" font-family="Montserrat">「等什么」与「谁配得上唤醒它」是两个东西</text><rect x="70" y="296.109" width="164.001" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="84.832" y="317.248" fill="#000" font-size="12" textLength="134.339" font-weight="700" font-family="Montserrat">③ 匹配键独立于等待类型</text><text x="80" y="331.217" fill="#000" font-size="12" textLength="144.001" font-family="Montserrat">否则任何同类事件都能唤醒</text><rect x="32.831" y="364.047" width="238.339" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.831" y="385.186" fill="#000" font-size="12" textLength="218.339" font-weight="700" font-family="Montserrat">④ 匹配决定唤醒谁，授权决定进不进模型</text><text x="50" y="399.154" fill="#000" font-size="12" textLength="204.002" font-family="Montserrat">否则「有个事件到了」＝「立即花钱」</text><rect x="16" y="431.984" width="272.002" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.831" y="453.123" fill="#000" font-size="12" textLength="206.339" font-weight="700" font-family="Montserrat">⑤ 不匹配就降级为「记一笔，不叫醒」</text><text x="26" y="467.092" fill="#000" font-size="12" textLength="252.002" font-family="Montserrat">只记录活跃度：最便宜的刹车，也是收益兑现点</text><rect x="64" y="499.922" width="176.001" height="47.938" fill="#F1F1F1" style="stroke:#DDE5DE;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="84.832" y="521.061" fill="#000" font-size="12" textLength="134.339" font-weight="700" font-family="Montserrat">⑥ 唤醒频率成为成本闸门</text><text x="74" y="535.029" fill="#000" font-size="12" textLength="156.001" font-family="Montserrat">于是：等待时间不再等于成本</text><ellipse cx="152.001" cy="578.859" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="152.001" cy="578.859" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="152.001" y1="72.297" x2="152.001" y2="92.297" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,82.297,152.001,92.297,156.001,82.297,152.001,86.297" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="140.234" x2="152.001" y2="160.234" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,150.234,152.001,160.234,156.001,150.234,152.001,154.234" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="208.172" x2="152.001" y2="228.172" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,218.172,152.001,228.172,156.001,218.172,152.001,222.172" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="276.109" x2="152.001" y2="296.109" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,286.109,152.001,296.109,156.001,286.109,152.001,290.109" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="344.047" x2="152.001" y2="364.047" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,354.047,152.001,364.047,156.001,354.047,152.001,358.047" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="411.984" x2="152.001" y2="431.984" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,421.984,152.001,431.984,156.001,421.984,152.001,425.984" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="479.922" x2="152.001" y2="499.922" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,489.922,152.001,499.922,156.001,489.922,152.001,493.922" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.001" y1="547.859" x2="152.001" y2="567.859" style="stroke:#1E7A4C;stroke-width:1;"/><polygon points="148.001,557.859,152.001,567.859,156.001,557.859,152.001,561.859" fill="#1E7A4C" style="stroke:#1E7A4C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><?plantuml-src JLBDKjfG5DxdAJBJ7RlEjDEPkaAHNRlg2wGIBICI9yJQxj9