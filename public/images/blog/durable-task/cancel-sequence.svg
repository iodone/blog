<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="759" viewBox="0 0 1200 759" role="img" aria-labelledby="title desc"><title id="title">取消：先封存旧权威，再核对真实世界</title><desc id="desc">关闭页面不等于停止执行；取消执行也不等于撤销外部副作用。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#315B45"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6E7C70"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C38B3C"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#AA5945"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#53717A"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9C5B7"/></marker></defs><rect width="100%" height="100%" fill="#F7F5EE"/><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183E2C" text-anchor="start">取消：先封存旧权威，再核对真实世界</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">关闭页面不等于停止执行；取消执行也不等于撤销外部副作用。</text><line x1="40" y1="88" x2="1160" y2="88" stroke="#B9C5B7" stroke-width="1"/><rect x="15.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="110" y="139" font-family="-apple-system,BlinkMacSystemFon