<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="698" viewBox="0 0 1200 698" role="img" aria-labelledby="title desc"><title id="title">等待与唤醒：等待住在事实里，不住在调用栈里</title><desc id="desc">执行单元可以退出；回答到达后，任意可用实例都能继续协调。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#315B45"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6E7C70"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C38B3C"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#AA5945"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#53717A"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9C5B7"/></marker></defs><rect width="100%" height="100%" fill="#F7F5EE"/><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183E2C" text-anchor="start">等待与唤醒：等待住在事实里，不住在调用栈里</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">执行单元可以退出；回答到达后，任意可用实例都能继续协调。</text><line x1="40" y1="88" x2="1160" y2="88" stroke="#B9C5B7" stroke-width="1"/><rect x="55.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="150" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="150" dy="0">用户</tspan></text><line x1="150" y1="158" x2="150" y2="663" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="355.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="450" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="450" dy="0">协调者</tspan></text><line x1="450" y1="158" x2="450" y2="663" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="655.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="750" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="750" dy="0">执行单元</tspan></text><line x1="750" y1="158" x2="750" y2="663" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="955.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="1050" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="1050" dy="0">持久事实</tspan></text><line x1="1050" y1="158" x2="1050" y2="663" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><line x1="460" y1="211" x2="1037" y2="211" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="750.0" y="199" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="750.0" dy="0">写入 Wait，标记等待</tspan></text><line x1="460" y1="272" x2="737" y2="272" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="600.0" y="260" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="600.0" dy="0">释放执行权</tspan></text><rect x="648" y="315" width="204" height="44" rx="7" fill="#E5EEF0" stroke="#E5EEF0" stroke-width="0"/><text x="750" y="334" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#53717A" text-anchor="middle"><tspan x="750" dy="0">退出</tspan><tspan x="750" dy="17">不保留等待</tspan></text><line x1="160" y1="409" x2="1037" y2="409" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="600.0" y="397" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="600.0" dy="0">提交回答（异步到达）</tspan></text><rect x="948" y="452" width="204" height="44" rx="7" fill="#F6ECD8" stroke="#F6ECD8" stroke-width="0"/><text x="1050" y="471" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#C38B3C" text-anchor="middle"><tspan x="1050" dy="0">同一事务</tspan><tspan x="1050" dy="17">回答 + 协调事件</tspan></text><line x1="1040" y1="546" x2="463" y2="546" stroke="#6E7C70" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><text x="750.0" y="534" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#6E7C70" text-anchor="middle"><tspan x="750.0" dy="0">通知 / 对账发现待处理事件</tspan></text><line x1="460" y1="607" x2="1037" y2="607" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="750.0" y="595" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="750.0" dy="0">读取 Wait、回答与历史</tspan></text><line x1="440" y1="668" x2="163" y2="668" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="300.0" y="656" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="300.0" dy="0">继续推进</tspan></text></svg>