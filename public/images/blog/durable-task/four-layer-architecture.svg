<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">四层架构：持久事实是权威，计算可以替换</title><desc id="desc">不是按技术栈分层，而是按“谁有权定义真相”分层。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#315B45"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6E7C70"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C38B3C"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#AA5945"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#53717A"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9C5B7"/></marker></defs><rect width="100%" height="100%" fill="#F7F5EE"/><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183E2C" text-anchor="start">四层架构：持久事实是权威，计算可以替换</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">不是按技术栈分层，而是按“谁有权定义真相”分层。</text><line x1="40" y1="88" x2="1160" y2="88" stroke="#B9C5B7" stroke-width="1"/><rect x="120" y="152" width="960" height="88" rx="12" fill="#F6ECD8" stroke="#C38B3C" stroke-width="1.5"/><text x="150" y="187" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#183E2C" text-anchor="start">01  产品层</text><text x="150" y="217" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6E7C70" text-anchor="start">提交目标 · 讨论 · 改派 · 取消 · 审核与验收</text><rect x="120" y="284" width="960" height="88" rx="12" fill="#E4EBDF" stroke="#315B45" stroke-width="1.5"/><text x="150" y="319" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#183E2C" text-anchor="start">02  协作层</text><text x="150" y="349" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6E7C70" text-anchor="start">整理目标 · 决定分派 · 判断等待与继续</text><rect x="120" y="448" width="960" height="88" rx="12" fill="#FFFEFA" stroke="#315B45" stroke-width="1.5"/><text x="150" y="483" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#183E2C" text-anchor="start">03  持久事实层</text><text x="150" y="513" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6E7C70" text-anchor="start">责任与协调状态 · 等待与结果 · 历史证据 · 长期认知</text><rect x="120" y="588" width="960" height="88" rx="12" fill="#E5EEF0" stroke="#53717A" stroke-width="1.5"/><text x="150" y="623" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#183E2C" text-anchor="start">04  计算层</text><text x="150" y="653" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6E7C70" text-anchor="start">按需启动临时执行单元 · 提交结果后退出</text><line x1="600" y1="240" x2="600" y2="280" stroke="#315B45" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M540 372 L540 446" fill="none" stroke="#315B45" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M660 446 L660 374" fill="none" stroke="#315B45" stroke-width="2" marker-end="url(#arrow-green)"/><line x1="600" y1="536" x2="600" y2="584" stroke="#315B45" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M1080 328 L1120 328 L1120 632 L1084 632" fill="none" stroke="#53717A" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="1143" y="447" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#53717A" text-anchor="middle"><tspan x="1143" dy="0">按</tspan><tspan x="1143" dy="20">需</tspan><tspan x="1143" dy="20">调</tspan><tspan x="1143" dy="20">度</tspan></text><text x="150" y="147" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#C38B3C" text-anchor="start">用户操作</text><text x="150" y="279" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#315B45" text-anchor="start">协调职责，不绑定永久在线的进程</text><text x="150" y="443" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#315B45" text-anchor="start">跨连接、跨进程、跨实例保存</text><text x="150" y="583" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#53717A" text-anchor="start">本地监督与消息驱动只负责当班计算</text></svg>