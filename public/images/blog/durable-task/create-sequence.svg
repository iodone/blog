ize="14" font-weight="500" fill="#315B45" text-anchor="middle"><tspan x="300.0" dy="0">返回负责人和有效上下文</tspan></text><rect x="70" y="575" width="310" height="58" rx="8" fill="#F6ECD8" stroke="#F6ECD8" stroke-width="0"/><text x="225.0" y="598" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#C38B3C" text-anchor="middle"><tspan x="225.0" dy="0">原文独立保存，整理失败可重试</tspan></text></svg>