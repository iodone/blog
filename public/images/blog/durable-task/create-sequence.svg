<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img" aria-labelledby="title desc"><title id="title">创建事项：先保存原文，再整理与创建</title><desc id="desc">手动创建和 Agent 创建共用一条协议；身份与权限由服务端补齐。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#315B45"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6E7C70"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C38B3C"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#AA5945"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#53717A"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9C5B7"/></marker></defs><rect width="100%" height="100%" fill="#F7F5EE"/><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183E2C" text-anchor="start">创建事项：先保存原文，再整理与创建</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">手动创建和 Agent 创建共用一条协议；身份与权限由服务端补齐。</text><line x1="40" y1="88" x2="1160" y2="88" stroke="#B9C5B7" stroke-width="1"/><rect x="55.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="150" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="150" dy="0">用户 / Agent</tspan></text><line x1="150" y1="158" x2="150" y2="541" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="355.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="450" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="450" dy="0">产品服务</tspan></text><line x1="450" y1="158" x2="450" y2="541" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="655.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="750" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="750" dy="0">协调者</tspan></text><line x1="750" y1="158" x2="750" y2="541" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="955.0" y="108" width="190" height="48" rx="9" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="1050" y="139" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#183E2C" text-anchor="middle"><tspan x="1050" dy="0">持久事实</tspan></text><line x1="1050" y1="158" x2="1050" y2="541" stroke="#B9C5B7" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="35" y="431" width="1130" height="94" rx="8" fill="#F6ECD8" stroke="#C38B3C" stroke-width="1.2" stroke-dasharray="5 4"/><text x="50" y="453" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#C38B3C" text-anchor="start">原子创建 · 支持幂等重试</text><line x1="160" y1="211" x2="437" y2="2