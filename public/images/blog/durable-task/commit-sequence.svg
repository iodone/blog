g SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#C38B3C" text-anchor="middle"><tspan x="228.0" dy="0">通知是门铃，持久事件才是事实</tspan></text></svg>