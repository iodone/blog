<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">概念关系：一个产品对象，一条持续的责任链</title><desc id="desc">事项面向人；Task、委托与执行面向系统。等待和结果挂在同一条责任链上。</desc><defs><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#315B45"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6E7C70"/></marker><marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C38B3C"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#AA5945"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#53717A"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9C5B7"/></marker></defs><rect width="100%" height="100%" fill="#F7F5EE"/><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183E2C" text-anchor="start">概念关系：一个产品对象，一条持续的责任链</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">事项面向人；Task、委托与执行面向系统。等待和结果挂在同一条责任链上。</text><line x1="40" y1="88" x2="1160" y2="88" stroke="#B9C5B7" stroke-width="1"/><rect x="385" y="112" width="430" height="65" rx="12" fill="#F6ECD8" stroke="#C38B3C" stroke-width="1.5"/><text x="405" y="143" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Issue · 事项</text><rect x="385" y="210" width="430" height="72" rx="12" fill="#E4EBDF" stroke="#315B45" stroke-width="1.5"/><text x="405" y="241" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Durable Task · 持续责任</text><line x1="600" y1="177" x2="600" y2="208" stroke="#315B45" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="115" y="325" width="400" height="64" rx="12" fill="#FFFEFA" stroke="#315B45" stroke-width="1.5"/><text x="135" y="356" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Phase · 实现</text><rect x="685" y="325" width="400" height="64" rx="12" fill="#FFFEFA" stroke="#315B45" stroke-width="1.5"/><text x="705" y="356" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Phase · 审核</text><path d="M540 246 L315 246 L315 322" fill="none" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><path d="M660 246 L885 246 L885 322" fill="none" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><line x1="516" y1="357" x2="680" y2="357" stroke="#6E7C70" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><rect x="115" y="430" width="400" height="64" rx="12" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="135" y="461" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Assignment · 交给执行 Agent</text><rect x="685" y="430" width="400" height="64" rx="12" fill="#FFFEFA" stroke="#B9C5B7" stroke-width="1.5"/><text x="705" y="461" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Assignment · 交给审核 Agent</text><line x1="315" y1="389" x2="315" y2="427" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><line x1="885" y1="389" x2="885" y2="427" stroke="#315B45" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="70" y="535" width="225" height="72" rx="12" fill="#F7E8E1" stroke="#AA5945" stroke-width="1.5"/><text x="90" y="566" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Attempt 1</text><text x="90" y="594" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#6E7C70" text-anchor="start">执行中断</text><rect x="340" y="535" width="225" height="72" rx="12" fill="#E4EBDF" stroke="#315B45" stroke-width="1.5"/><text x="360" y="566" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Attempt 2</text><text x="360" y="594" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#6E7C70" text-anchor="start">接管并提交结果</text><line x1="265" y1="494" x2="265" y2="514" stroke="#6E7C70" stroke-width="1.5"/><line x1="370" y1="494" x2="370" y2="514" stroke="#6E7C70" stroke-width="1.5"/><line x1="265" y1="514" x2="182" y2="514" stroke="#6E7C70" stroke-width="1.5"/><line x1="370" y1="514" x2="452" y2="514" stroke="#6E7C70" stroke-width="1.5"/><line x1="182" y1="514" x2="182" y2="532" stroke="#6E7C70" stroke-width="1.5" marker-end="url(#arrow-muted)"/><line x1="452" y1="514" x2="452" y2="532" stroke="#6E7C70" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="630" y="535" width="225" height="72" rx="12" fill="#E5EEF0" stroke="#53717A" stroke-width="1.5"/><text x="650" y="566" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Wait</text><text x="650" y="594" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#6E7C70" text-anchor="start">等待条件与超时</text><path d="M315 494 L315 516 L742 516 L742 532" fill="none" stroke="#53717A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/><rect x="905" y="535" width="225" height="72" rx="12" fill="#F6ECD8" stroke="#C38B3C" stroke-width="1.5"/><text x="925" y="566" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#183E2C" text-anchor="start">Result + Receipt</text><text x="925" y="594" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#6E7C70" text-anchor="start">交付内容与执行回执</text><path d="M565 571 L900 571" fill="none" stroke="#C38B3C" stroke-width="1.8" marker-end="url(#arrow-gold)"/><rect x="70" y="658" width="1060" height="56" rx="9" fill="#F7F5EE" stroke="#B9C5B7" stroke-width="1.2" stroke-dasharray="5 4"/><text x="95" y="692" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7C70" text-anchor="start">恢复机制：Lease（写入许可） + Epoch（写者代际） · 历史保存事实，长期记忆保存可修订结论</text></svg>