<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="persistence-boundary-title persistence-boundary-desc" id="persistence-boundary-root"><title id="persistence-boundary-title">持久事实为责任提供住所</title><desc id="persistence-boundary-desc">协调职责从持久事实恢复，责任、交接和历史保存在系统权威内，临时执行单元可以被替换。</desc><defs>
      <style>#persistence-boundary-root { --color-paper:#faf9f5;--color-ink:#2b2d2a;--color-muted:#65635c;--font-sans:Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif;--font-serif:Instrument Serif, Noto Serif, Songti SC, STSong, serif;--font-mono:Geist Mono, Noto Sans Mono CJK SC, ui-monospace, monospace }
      #persistence-boundary-root { font-family: var(--font-sans); color: var(--color-ink); }
      #persistence-boundary-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#persistence-boundary-root .diagram-container { overflow-x:visible }
}</style><marker id="persistence-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#65635c"/></marker><marker id="persistence-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a34f2c"/></marker><marker id="persistence-boundary-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#416b64"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><rect x="104" y="48" width="1072" height="600" rx="8" fill="#2b2d2a" stroke="#2b2d2a" stroke-width="1" fill-opacity="0.015" stroke-opacity="0.30"/><rect x="160" y="120" width="960" height="424" rx="8" fill="#2b2d2a" stroke="#65635c" stroke-width="1" fill-opacity="0.025"/><rect x="256" y="224" width="768" height="216" rx="8" fill="#a34f2c" stroke="#a34f2c" stroke-width="1" fill-opacity="0.08"/><rect x="144" y="36" width="160" height="24" rx="2" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><text x="224" y="53" fill="#65635c" font-size="12" font-weight="500" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">协作职责</text><text x="640" y="96" fill="#2b2d2a" font-size="14" font-weight="500" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">整理目标 · 决定分派 · 判断等待与继续</text><rect x="200" y="108" width="208" height="24" rx="2" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><text x="304" y="125" fill="#65635c" font-size="12" font-weight="500" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">持久事实 · 系统权威</text><text x="640" y="176" fill="#2b2d2a" font-size="14" font-weight="500" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">只有这里能回答：工作为什么可以继续</text><rect x="296" y="212" width="208" height="24" rx="2" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><text x="400" y="229" fill="#a34f2c" font-size="12" font-weight="500" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">继续负责所需的事实</text><rect x="304" y="280" width="176" height="88" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="304" y="280" width="176" height="88" rx="6" fill="#a34f2c" stroke="#a34f2c" stroke-width="1" fill-opacity="0.08"/><text x="392.0" y="304" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">责任</text><text x="392.0" y="327" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">目标、委托与验收权</text><rect x="528" y="280" width="176" height="88" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="528" y="280" width="176" height="88" rx="6" fill="#a34f2c" stroke="#a34f2c" stroke-width="1" fill-opacity="0.08"/><text x="616.0" y="304" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">交接</text><text x="616.0" y="327" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">等待、结果与取消意图</text><rect x="752" y="280" width="176" height="88" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="752" y="280" width="176" height="88" rx="6" fill="#a34f2c" stroke="#a34f2c" stroke-width="1" fill-opacity="0.08"/><text x="840.0" y="304" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">历史</text><text x="840.0" y="327" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">事实可追溯，认知可修订</text><text x="640" y="408" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">执行身份：当前 Attempt · 有效写者 · 写者代际</text><rect x="424" y="680" width="432" height="64" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="424" y="680" width="432" height="64" rx="6" fill="#2b2d2a" stroke="#2b2d2a" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="640.0" y="704" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">临时执行单元</text><text x="640.0" y="727" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">按需启动、提交事实，然后退出</text></svg>
