="152" width="360" height="64" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="460" y="152" width="360" height="64" rx="6" fill="#ffffff" stroke="#2b2d2a" stroke-width="1"/><text x="640.0" y="176" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">Durable Task</text><text x="640.0" y="199" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">跨连接、进程和实例保存责任</text><rect x="144" y="264" width="256" height="64" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="144" y="264" width="256" height="64" rx="6" fill="#2b2d2a" stroke="#65635c" stroke-width="1" fill-opacity="0.05"/><text x="272.0" y="288" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">Phase · 阶段</text><text x="272.0" y="311" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">实现、审核与验收</text><rect x="880" y="264" width="256" height="64" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="880" y="264" width="256" height="64" rx="6" fill="#2b2d2a" stroke="#65635c" stroke-width="1" fill-opacity="0.05"/><text x="1008.0" y="288" fill="#2b2d2a" font-size="12" font-weight="600" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">Assignment · 委托</text><text x="1008.0" y="311" fill="#65635c" font-size="12" font-weight="400" font-family="Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">把阶段交给执行者</text><rect x="880" y="376" width="256" height="64" rx="6" fill="#faf9f5" stroke="#faf9f5" stroke-width="1"/><rect x="880" y="376" width="256" height="64" rx="6" fill="#2b2d2a" stroke="#2b2d2a" stroke-width="1" fill-opacity="0.03" stroke-o