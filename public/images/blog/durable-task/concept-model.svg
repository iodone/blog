<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concept-model-title concept-model-desc" id="concept-model-root"><title id="concept-model-title">一件工作如何拆成持续责任</title><desc id="concept-model-desc">事项通过 Task、阶段、委托与执行代际组织责任，等待和结果让跨时间交接可追溯。</desc><defs>
      <style>#concept-model-root { --color-paper:#faf9f5;--color-ink:#2b2d2a;--color-muted:#65635c;--font-sans:Geist, PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif;--font-serif:Instrument Serif, Noto Serif, Songti SC, STSong, serif;--font-mono:Geist Mono, Noto Sans Mono CJK SC, ui-monospace, monospace }
      #concept-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #concept-model-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#concept-model-root .diagram-container { overflow-x:visible }
