<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="五级形态：从一问一答到流水线，依赖你开口的程度逐级下降，L3 门禁是分水岭">
  <defs>
    <style>
      .t  { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 14px; font-weight: 500; }
      .ts { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 12px; }
    </style>
  </defs>

  <rect x="40" y="80" width="150" height="270" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="115" y="100" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L0</text>
  <text class="t"  x="115" y="322" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">一问一答</text>
  <text class="ts" x="115" y="342" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">产物 = 对话</text>

  <rect x="210" y="140" width="150" height="210" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="285" y="160" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L1</text>
  <text class="t"  x="285" y="322" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">模板</text>
  <text class="ts" x="285" y="342" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">产物 = 文本</text>

  <rect x="380" y="200" width="150" height="150" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="455" y="220" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L2</text>
  <text class="t"  x="455" y="322" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">常驻约束</text>
  <text class="ts" x="455" y="342" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">产物 = 约束</text>

  <rect x="550" y="270" width="150" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text class="ts" x="625" y="290" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">L3</text>
  <text class="t"  x="625" y="312" text-anchor="middle" dominant-baseline="central" fill="#27500A">门禁</text>
  <text class="ts" x="625" y="332" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">产物 = 结构</text>

  <rect x="720" y="310" width="150" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text class="ts" x="795" y="322" text-anchor="middle" dominant-baseline="central" fill="#27500A">L4 流水线</text>
  <text class="ts" x="795" y="340" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">产物 = 生产线</text>

  <line x1="40" y1="372" x2="870" y2="372" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="ts" x="40" y="394" dominant-baseline="central" fill="#5F5E5A">← 还要你开口</text>
  <text class="ts" x="870" y="394" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">不再需要你开口 →</text>

  <line x1="537" y1="56" x2="537" y2="382" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="470" y="36" width="134" height="26" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="ts" x="537" y="50" text-anchor="middle" dominant-baseline="central" fill="#633806">L3 是分水岭</text>

  <rect x="40" y="428" width="820" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="440" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="80" y="446" dominant-baseline="central" fill="#444441">还要你开口</text>
  <rect x="220" y="440" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text class="ts" x="240" y="446" dominant-baseline="central" fill="#444441">不再需要你开口</text>
  <rect x="430" y="440" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="ts" x="450" y="446" dominant-baseline="central" fill="#444441">分水岭</text>
  <text class="ts" x="860" y="446" text-anchor="end" dominant-baseline="central" fill="#444441">柱高 = 下次还要你开口的程度</text>
</svg>
