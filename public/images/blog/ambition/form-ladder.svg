<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="五层台阶：从一句对话到一条流水线，一层压一层，越往上越不需要你开口">
  <defs>
    <style>
      .t  { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 14px; font-weight: 500; }
      .ts { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 12px; }
    </style>
  </defs>

  <text class="t" x="80" y="36" fill="#2C2C2A">一层压一层：越往上，越不需要你开口</text>

  <rect x="80" y="60" width="740" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text class="ts" x="110" y="96" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">L4</text>
  <text class="t"  x="160" y="86" dominant-baseline="central" fill="#27500A">流水线</text>
  <text class="ts" x="160" y="110" dominant-baseline="central" fill="#3B6D11">产物 = 生产线 · 不用你守着也能转</text>
  <text class="ts" x="790" y="96" text-anchor="end" dominant-baseline="central" fill="#3B6D11">不再需要你开口</text>

  <rect x="80" y="144" width="740" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text class="ts" x="110" y="180" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">L3</text>
  <text class="t"  x="160" y="170" dominant-baseline="central" fill="#27500A">门禁</text>
  <text class="ts" x="160" y="194" dominant-baseline="central" fill="#3B6D11">产物 = 可执行的结构 · 不做就过不去</text>
  <text class="ts" x="790" y="180" text-anchor="end" dominant-baseline="central" fill="#3B6D11">不再需要你开口</text>

  <line x1="60" y1="241" x2="840" y2="241" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="370" y="227" width="160" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="ts" x="450" y="241" text-anchor="middle" dominant-baseline="central" fill="#633806">L3 是分水岭</text>

  <rect x="80" y="266" width="740" height="72" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="110" y="302" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L2</text>
  <text class="t"  x="160" y="292" dominant-baseline="central" fill="#2C2C2A">常驻约束</text>
  <text class="ts" x="160" y="316" dominant-baseline="central" fill="#5F5E5A">产物 = 约束 · 少说几句，但还得说</text>
  <text class="ts" x="790" y="302" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">还要你开口</text>

  <rect x="80" y="350" width="740" height="72" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="110" y="386" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L1</text>
  <text class="t"  x="160" y="376" dominant-baseline="central" fill="#2C2C2A">模板</text>
  <text class="ts" x="160" y="400" dominant-baseline="central" fill="#5F5E5A">产物 = 文本 · 粘得上，但不会自己跑</text>
  <text class="ts" x="790" y="386" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">还要你开口</text>

  <rect x="80" y="434" width="740" height="72" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="110" y="470" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L0</text>
  <text class="t"  x="160" y="460" dominant-baseline="central" fill="#2C2C2A">一问一答</text>
  <text class="ts" x="160" y="484" dominant-baseline="central" fill="#5F5E5A">产物 = 对话 · 不可复用、不可回滚、不可复跑</text>
  <text class="ts" x="790" y="470" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">每句都要你开口</text>

  <rect x="80" y="526" width="740" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="100" y="538" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="120" y="544" dominant-baseline="central" fill="#444441">还要你开口</text>
  <rect x="260" y="538" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text class="ts" x="280" y="544" dominant-baseline="central" fill="#444441">不再需要你开口</text>
  <rect x="470" y="538" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="ts" x="490" y="544" dominant-baseline="central" fill="#444441">分水岭</text>
</svg>
