<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="四个改法：改目标和改方法是同一次调整的两个方向，改视角与它垂直，改速度不在这张图上">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 14px; font-weight: 500; }
      .ts { font-family: "Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif; font-size: 12px; }
    </style>
  </defs>

  <line x1="450" y1="232" x2="450" y2="118" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="292" x2="450" y2="446" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="552" y1="264" x2="632" y2="264" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="292" y1="264" x2="344" y2="264" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>

  <g>
    <rect x="350" y="52" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text class="t"  x="450" y="72" text-anchor="middle" dominant-baseline="central" fill="#3C3489">改目标</text>
    <text class="ts" x="450" y="92" text-anchor="middle" dominant-baseline="central" fill="#534AB7">向上 · 修这个崩溃 → 别再有崩溃</text>
  </g>

  <g>
    <rect x="350" y="236" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
    <text class="t"  x="450" y="256" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">你交给它的任务</text>
    <text class="ts" x="450" y="276" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">你打算怎么做到</text>
  </g>

  <g>
    <rect x="350" y="452" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text class="t"  x="450" y="472" text-anchor="middle" dominant-baseline="central" fill="#3C3489">改方法</text>
    <text class="ts" x="450" y="492" text-anchor="middle" dominant-baseline="central" fill="#534AB7">向下 · 表格 → 数据库 + 统计模型</text>
  </g>

  <g>
    <rect x="638" y="236" width="212" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text class="t"  x="744" y="256" text-anchor="middle" dominant-baseline="central" fill="#085041">改视角</text>
    <text class="ts" x="744" y="276" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">向外 · 分析师 + 记者 + 红队</text>
  </g>

  <g>
    <rect x="52" y="236" width="236" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
    <text class="t"  x="170" y="256" text-anchor="middle" dominant-baseline="central" fill="#444441">改速度</text>
    <text class="ts" x="170" y="276" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">只让事情变快，不在这张图上</text>
  </g>

  <rect x="40" y="508" width="820" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="60" y="520" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="ts" x="80" y="526" dominant-baseline="central" fill="#444441">改目标和改方法是同一个方向的两头</text>
  <rect x="360" y="520" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="ts" x="380" y="526" dominant-baseline="central" fill="#444441">改视角与它垂直</text>
  <rect x="580" y="520" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ts" x="600" y="526" dominant-baseline="central" fill="#444441">改速度不在这张图上</text>
</svg>
