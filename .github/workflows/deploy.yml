name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo, write a deployment, and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: a half-published site is worse
# than a slightly stale one, and these builds take seconds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads `packageManager` from package.json - no version to drift here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build-free preflight: env, structure, authoring rules, types, migrations.
      # Fails fast on content/config problems that would otherwise surface as a
      # broken deploy. Same command as the README upgrade section.
      - name: Nimbus preflight
        run: pnpm exec nimbus-docs check

      - name: Build
        run: pnpm build

      # Writes the resolved Pages URL into the artifact; harmless if unused.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
